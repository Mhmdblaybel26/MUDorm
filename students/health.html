<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MU Dorm</title>
  <link rel="icon" href="../manager/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <!-- Same design system and shell as the admin console -->
  <link rel="stylesheet" href="../manager/css/base.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/layout.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/components.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/rtl.css?v=20261123h">
  <link rel="stylesheet" href="css/portal.css?v=20261123h">
  <!-- Not deferred: applies the saved language, direction and theme before the first paint. -->
  <script src="../manager/js/i18n.js?v=20261123h"></script>
  <script src="../manager/js/icons.js?v=20261123h" defer></script>
  <script src="../manager/js/sound.js?v=20261123h" defer></script>
  <script src="../manager/js/config.js?v=20261123h" defer></script>
  <script src="../manager/js/api.js?v=20261123h" defer></script>
  <script src="../manager/js/data.js?v=20261123h" defer></script>
  <script src="../manager/js/translate.js?v=20261123h" defer></script>
  <script src="../manager/js/app.js?v=20261123h" defer></script>
  <script src="js/portal.js?v=20261123h" defer></script>
  <script src="js/health.js?v=20261123h" defer></script>
</head>
<body data-area="student" data-page="health">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="snav.health"></h1>
            <p class="page-sub" data-i18n="shealth.sub"></p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn--primary" id="add-request"><span data-icon="stethoscope"></span><span data-i18n="shealth.ask"></span></button>
          </div>
        </div>
        <section class="emergency" aria-labelledby="em-title">
          <div class="emergency__main">
            <span class="tile"><span data-icon="phone" data-size="24"></span></span>
            <div>
              <h2 class="emergency__title" id="em-title" data-i18n="shealth.emTitle"></h2>
              <p data-i18n="shealth.emText"></p>
            </div>
            <a class="btn btn--danger btn--lg emergency__call" id="hotline"></a>
          </div>
          <ul class="emergency__lines" id="public-lines"></ul>
          <p class="emergency__clinic" id="clinic"></p>
        </section>

        <div id="health-notice"></div>
        <section class="card" id="request-list" aria-labelledby="request-list-title">
          <div class="card__head"><h2 class="card__title" id="request-list-title" data-i18n="shealth.mine"></h2></div>
          <div class="table-wrap" data-list-table>
            <table class="table table--stack">
              <thead><tr><th scope="col" data-i18n="shealth.colRequest"></th><th scope="col" data-i18n="shealth.colProblem"></th><th scope="col" data-i18n="shealth.colAppointment"></th><th scope="col" data-i18n="common.status"></th><th scope="col"><span class="sr-only" data-i18n="common.actions"></span></th></tr></thead>
              <tbody data-list-body></tbody>
            </table>
          </div>
          <div data-list-empty hidden></div>
          <div class="pagination" data-list-pager></div>
        </section>

        <section class="card" aria-labelledby="hp-title">
          <div class="card__head"><div><h2 class="card__title" id="hp-title" data-i18n="shealth.profileTitle"></h2><p class="card__sub" data-i18n="shealth.profileSub"></p></div></div>
          <dl class="card__body kv" id="health-profile"></dl>
        </section>
      </main>

      <footer class="app-footer" data-i18n="app.footerStudent"></footer>
    </div>
  </div>

  <dialog class="modal" id="request-modal" aria-labelledby="request-modal-title">
    <form class="modal__form" id="request-form" novalidate>
      <div class="modal__head">
        <div>
          <h2 class="modal__title" id="request-modal-title"></h2>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body stack">
          <div class="notice notice--danger"><span data-icon="alert"></span><div><strong data-i18n="shealth.urgentTitle"></strong><span id="urgent-text"></span></div></div>
          <fieldset class="fieldset field">
            <legend class="field__label"><span data-i18n="shealth.urgency"></span><span class="field__req" aria-hidden="true">*</span></legend>
            <div class="radios">
              <label class="radio"><input type="radio" name="urgency" value="normal" checked><span data-i18n="shealth.normal"></span></label>
              <label class="radio"><input type="radio" name="urgency" value="urgent"><span data-i18n="shealth.urgent"></span></label>
            </div>
          </fieldset>
            <div class="field">
              <label class="field__label" for="rq-symptoms"><span data-i18n="shealth.symptoms"></span><span class="field__req" aria-hidden="true">*</span></label>
              <textarea class="control" id="rq-symptoms" name="symptoms" required aria-describedby="rq-symptoms-hint" maxlength="500" dir="auto" rows="5"></textarea>
              <p class="field__hint" id="rq-symptoms-hint" data-i18n="shealth.symptomsHint"></p>
            </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="shealth.send"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
