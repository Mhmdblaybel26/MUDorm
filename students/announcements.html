<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MU Dorm</title>
  <link rel="icon" href="../manager/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <!-- Same design system and shell as the admin console -->
  <link rel="stylesheet" href="../manager/css/base.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/layout.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/components.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/rtl.css?v=20261123h">
  <link rel="stylesheet" href="css/portal.css?v=20261123h">
  <!-- Not deferred: applies the saved language, direction and theme before the first paint. -->
  <script src="../manager/js/i18n.js?v=20261123h"></script>
  <script src="../manager/js/icons.js?v=20261123h" defer></script>
  <script src="../manager/js/sound.js?v=20261123h" defer></script>
  <script src="../manager/js/config.js?v=20261123h" defer></script>
  <script src="../manager/js/api.js?v=20261123h" defer></script>
  <script src="../manager/js/data.js?v=20261123h" defer></script>
  <script src="../manager/js/translate.js?v=20261123h" defer></script>
  <script src="../manager/js/app.js?v=20261123h" defer></script>
  <script src="js/portal.js?v=20261123h" defer></script>
  <script src="js/announcements.js?v=20261123h" defer></script>
</head>
<body data-area="student" data-page="announcements">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="snav.announcements"></h1>
            <p class="page-sub" data-i18n="sann.sub"></p>
          </div>
        </div>

        <div class="segmented" role="group" data-i18n-aria-label="sann.show" id="tabs">
          <button type="button" data-tab="news" aria-pressed="true" aria-controls="panel-news"><span data-i18n="sann.tabNews"></span> <span id="news-count"></span></button>
          <button type="button" data-tab="notifications" aria-pressed="false" aria-controls="panel-notifications"><span data-i18n="sann.tabAlerts"></span> <span id="alert-count"></span></button>
        </div>

        <section class="card" id="panel-news" aria-labelledby="news-title">
          <div class="card__head"><h2 class="card__title" id="news-title" data-i18n="sann.newsTitle"></h2></div>
          <ul class="ann-list" id="news"></ul>
        </section>

        <section class="card" id="panel-notifications" aria-labelledby="alerts-title" hidden>
          <div class="card__head">
            <h2 class="card__title" id="alerts-title" data-i18n="sann.alertsTitle"></h2>
            <button type="button" class="btn btn--ghost btn--sm" id="alerts-read" data-i18n="notif.markRead"></button>
          </div>
          <ul class="notif-list notif-list--page" id="alerts"></ul>
        </section>
      </main>

      <footer class="app-footer" data-i18n="app.footerStudent"></footer>
    </div>
  </div>
  <dialog class="modal" id="detail-modal" aria-labelledby="detail-title">
    <div class="modal__head">
      <div>
        <h2 class="modal__title" id="detail-title"></h2>
        <p class="modal__sub" id="detail-sub"></p>
      </div>
      <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close" autofocus><span data-icon="x"></span></button>
    </div>
    <div class="modal__body stack" id="detail-body"></div>
    <div class="modal__foot" id="detail-foot"></div>
  </dialog>
</body>
</html>
