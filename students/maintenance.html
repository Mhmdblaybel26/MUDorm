<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MU Dorm</title>
  <link rel="icon" href="../manager/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <!-- Same design system and shell as the admin console -->
  <link rel="stylesheet" href="../manager/css/base.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/layout.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/components.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/rtl.css?v=20261123h">
  <link rel="stylesheet" href="css/portal.css?v=20261123h">
  <!-- Not deferred: applies the saved language, direction and theme before the first paint. -->
  <script src="../manager/js/i18n.js?v=20261123h"></script>
  <script src="../manager/js/icons.js?v=20261123h" defer></script>
  <script src="../manager/js/sound.js?v=20261123h" defer></script>
  <script src="../manager/js/config.js?v=20261123h" defer></script>
  <script src="../manager/js/api.js?v=20261123h" defer></script>
  <script src="../manager/js/data.js?v=20261123h" defer></script>
  <script src="../manager/js/translate.js?v=20261123h" defer></script>
  <script src="../manager/js/app.js?v=20261123h" defer></script>
  <script src="js/portal.js?v=20261123h" defer></script>
  <script src="js/maintenance.js?v=20261123h" defer></script>
</head>
<body data-area="student" data-page="maintenance">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="snav.maintenance"></h1>
            <p class="page-sub" data-i18n="smaint.sub"></p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn--primary" id="add-ticket"><span data-icon="plus"></span><span data-i18n="smaint.new"></span></button>
          </div>
        </div>

        <div id="maint-notice"></div>
        <div class="chips" id="status-chips" role="group" data-i18n-aria-label="common.quickFilter"></div>

        <section class="card" id="ticket-list" aria-labelledby="ticket-list-title">
          <h2 class="sr-only" id="ticket-list-title" data-i18n="smaint.listTitle"></h2>
          <div class="toolbar">
            <div class="toolbar__search">
              <span data-icon="search"></span>
              <label class="sr-only" for="tk-search" data-i18n="common.search"></label>
              <input class="control" id="tk-search" type="search" autocomplete="off" data-list-search data-i18n-placeholder="smaint.searchPh">
            </div>
            <label class="sr-only" for="tk-status" data-i18n="common.status"></label>
            <select class="control" id="tk-status" data-list-filter="status">
              <option value="all" data-i18n="common.allStatuses"></option>
              <option value="pending" data-i18n="status.pending"></option>
              <option value="in_progress" data-i18n="status.in_progress"></option>
              <option value="resolved" data-i18n="status.resolved"></option>
            </select>
          </div>
          <div data-list-table><ul class="tickets" data-list-body></ul></div>
          <div data-list-empty hidden></div>
          <div class="pagination" data-list-pager></div>
        </section>
      </main>

      <footer class="app-footer" data-i18n="app.footerStudent"></footer>
    </div>
  </div>

  <dialog class="modal" id="ticket-modal" aria-labelledby="ticket-title">
    <form class="modal__form" id="ticket-modal-form" novalidate>
      <div class="modal__head">
        <div>
          <h2 class="modal__title" id="ticket-title"></h2>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body">
            <div class="field">
              <span class="field__label" id="tk-cat-label"><span data-i18n="smaint.category"></span><span class="field__req" aria-hidden="true">*</span></span>
              <div class="radios" role="radiogroup" aria-labelledby="tk-cat-label" id="tk-categories"></div>
            </div>
              <div class="field">
                <label class="field__label" for="tk-desc"><span data-i18n="smaint.describe"></span><span class="field__req" aria-hidden="true">*</span></label>
                <textarea class="control" id="tk-desc" name="description" required aria-describedby="tk-desc-hint" maxlength="600" dir="auto" rows="5"></textarea>
                <p class="field__hint" id="tk-desc-hint" data-i18n="smaint.describeHint"></p>
              </div>
            <div class="field">
              <span class="field__label" id="tk-photo-label" data-i18n="smaint.photo"></span>
              <div class="upload">
                <div class="upload__preview" id="tk-photo-preview"></div>
                <div class="upload__actions">
                  <input class="upload__input" id="tk-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" aria-describedby="tk-photo-label tk-photo-hint">
                  <label class="btn btn--secondary btn--sm" for="tk-photo"><span data-icon="upload" data-size="16"></span><span data-i18n="smaint.choosePhoto"></span></label>
                  <button type="button" class="btn btn--ghost btn--sm" id="tk-photo-remove" data-i18n="smaint.removePhoto" hidden></button>
                  <p class="field__hint" id="tk-photo-hint" data-i18n="smaint.photoHint"></p>
                </div>
              </div>
            </div>
            <p class="field__hint" id="tk-room"></p>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="smaint.send"></button>
      </div>
    </form>
  </dialog>
  <dialog class="modal modal--lg" id="view-modal" aria-labelledby="view-title">
    <div class="modal__head">
      <div>
        <h2 class="modal__title" id="view-title"></h2>
        <p class="modal__sub" id="view-sub"></p>
      </div>
      <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close" autofocus><span data-icon="x"></span></button>
    </div>
    <div class="modal__body" id="view-body"></div>
    <div class="modal__foot"><button type="button" class="btn btn--primary" data-close data-i18n="common.close"></button></div>
  </dialog>
</body>
</html>
