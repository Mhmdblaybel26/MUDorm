<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MU Dorm</title>
  <link rel="icon" href="../manager/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <!-- Same design system and shell as the admin console -->
  <link rel="stylesheet" href="../manager/css/base.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/layout.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/components.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/rtl.css?v=20261123h">
  <link rel="stylesheet" href="css/portal.css?v=20261123h">
  <!-- Not deferred: applies the saved language, direction and theme before the first paint. -->
  <script src="../manager/js/i18n.js?v=20261123h"></script>
  <script src="../manager/js/icons.js?v=20261123h" defer></script>
  <script src="../manager/js/sound.js?v=20261123h" defer></script>
  <script src="../manager/js/config.js?v=20261123h" defer></script>
  <script src="../manager/js/api.js?v=20261123h" defer></script>
  <script src="../manager/js/data.js?v=20261123h" defer></script>
  <script src="../manager/js/translate.js?v=20261123h" defer></script>
  <script src="../manager/js/app.js?v=20261123h" defer></script>
  <script src="js/portal.js?v=20261123h" defer></script>
  <script src="js/leave.js?v=20261123h" defer></script>
</head>
<body data-area="student" data-page="leave">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="snav.leave"></h1>
            <p class="page-sub" data-i18n="sleave.sub"></p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn--primary" id="add-leave"><span data-icon="plus"></span><span data-i18n="sleave.new"></span></button>
          </div>
        </div>

        <div class="notice notice--accent">
          <span data-icon="info"></span>
          <div><strong data-i18n="sleave.ruleTitle"></strong><span data-i18n="sleave.ruleText"></span></div>
        </div>
        <section class="card" id="leave-list" aria-labelledby="leave-list-title">
          <div class="card__head"><h2 class="card__title" id="leave-list-title" data-i18n="sleave.listTitle"></h2></div>
          <div class="table-wrap" data-list-table>
            <table class="table table--stack">
              <thead><tr><th scope="col" data-i18n="sleave.dates"></th><th scope="col" data-i18n="sleave.destination"></th><th scope="col" data-i18n="common.reason"></th><th scope="col" data-i18n="common.status"></th><th scope="col"><span class="sr-only" data-i18n="common.actions"></span></th></tr></thead>
              <tbody data-list-body></tbody>
            </table>
          </div>
          <div data-list-empty hidden></div>
          <div class="pagination" data-list-pager></div>
        </section>
      </main>

      <footer class="app-footer" data-i18n="app.footerStudent"></footer>
    </div>
  </div>

  <dialog class="modal" id="leave-modal" aria-labelledby="leave-title">
    <form class="modal__form" id="leave-modal-form" novalidate>
      <div class="modal__head">
        <div>
          <h2 class="modal__title" id="leave-title"></h2>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body">
            <div class="form-grid">
              <fieldset class="field field--group field--full">
                <legend class="field__label" data-i18n="sleave.type"></legend>
                <div class="radios">
                  <label class="radio"><input type="radio" name="type" value="temporary" checked><span data-i18n="sleave.typeTemporary"></span></label>
                  <label class="radio"><input type="radio" name="type" value="final"><span data-i18n="sleave.typeFinal"></span></label>
                </div>
                <p class="field__hint" id="lv-type-hint"></p>
              </fieldset>
              <div class="field">
                <label class="field__label" for="lv-from"><span data-i18n="sleave.departure"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="lv-from" name="departure_date" type="date" required >
              </div>
              <div class="field">
                <label class="field__label" for="lv-from-time"><span data-i18n="sleave.departureTime"></span></label>
                <input class="control" id="lv-from-time" name="departure_time" type="time" aria-describedby="lv-time-hint">
              </div>
              <div class="field" data-temporary>
                <label class="field__label" for="lv-to"><span data-i18n="sleave.return"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="lv-to" name="return_date" type="date" required >
              </div>
              <div class="field" data-temporary>
                <label class="field__label" for="lv-to-time"><span data-i18n="sleave.returnTime"></span></label>
                <input class="control" id="lv-to-time" name="return_time" type="time" aria-describedby="lv-time-hint">
              </div>
              <p class="field__hint field--full" id="lv-time-hint" data-temporary data-i18n="sleave.timeHint"></p>
              <div class="field field--full" data-temporary>
                <label class="field__label" for="lv-dest"><span data-i18n="sleave.destination"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="lv-dest" name="destination" type="text" required maxlength="60" dir="auto" data-i18n-placeholder="sleave.destinationPh">
              </div>
              <div class="field field--full">
                <label class="field__label" for="lv-reason"><span data-i18n="common.reason"></span><span class="field__req" aria-hidden="true">*</span></label>
                <textarea class="control" id="lv-reason" name="reason" required aria-describedby="lv-reason-hint" maxlength="300" dir="auto" rows="4"></textarea>
                <p class="field__hint" id="lv-reason-hint" data-i18n="sleave.reasonHint"></p>
              </div>
            </div>
            <p class="field__hint" id="lv-nights" aria-live="polite"></p>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="sleave.send"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
