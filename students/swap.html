<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MU Dorm</title>
  <link rel="icon" href="../manager/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <!-- Same design system and shell as the admin console -->
  <link rel="stylesheet" href="../manager/css/base.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/layout.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/components.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/rtl.css?v=20261123h">
  <link rel="stylesheet" href="css/portal.css?v=20261123h">
  <!-- Not deferred: applies the saved language, direction and theme before the first paint. -->
  <script src="../manager/js/i18n.js?v=20261123h"></script>
  <script src="../manager/js/icons.js?v=20261123h" defer></script>
  <script src="../manager/js/sound.js?v=20261123h" defer></script>
  <script src="../manager/js/config.js?v=20261123h" defer></script>
  <script src="../manager/js/api.js?v=20261123h" defer></script>
  <script src="../manager/js/data.js?v=20261123h" defer></script>
  <script src="../manager/js/translate.js?v=20261123h" defer></script>
  <script src="../manager/js/app.js?v=20261123h" defer></script>
  <script src="js/portal.js?v=20261123h" defer></script>
  <script src="js/swap.js?v=20261123h" defer></script>
</head>
<body data-area="student" data-page="swap">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="snav.swap"></h1>
            <p class="page-sub" data-i18n="sswap.sub"></p>
          </div>
        </div>

        <div id="swap-notice"></div>
        <div class="grid-aside">
          <section class="card" aria-labelledby="swap-form-title">
            <div class="card__head"><div><h2 class="card__title" id="swap-form-title" data-i18n="sswap.formTitle"></h2><p class="card__sub" data-i18n="sswap.formSub"></p></div></div>
            <form class="card__body stack" id="swap-form" novalidate>
              <div class="field">
                <label class="field__label" for="sw-target"><span data-i18n="sswap.with"></span><span class="field__req" aria-hidden="true">*</span></label>
                <select class="control" id="sw-target" name="target_id" required ></select>
              </div>
              <div class="compare" id="swap-compare"></div>
              <div class="field">
                <label class="field__label" for="sw-reason"><span data-i18n="common.reason"></span><span class="field__req" aria-hidden="true">*</span></label>
                <textarea class="control" id="sw-reason" name="reason" required aria-describedby="sw-reason-hint" maxlength="300" dir="auto" rows="4"></textarea>
                <p class="field__hint" id="sw-reason-hint" data-i18n="sswap.reasonHint"></p>
              </div>
              <div class="form-actions"><button type="submit" class="btn btn--primary"><span data-icon="swap" data-size="16"></span><span data-i18n="sswap.send"></span></button></div>
            </form>
          </section>
          <div class="stack">
            <section class="card" id="swap-list" aria-labelledby="swap-list-title">
          <div class="card__head"><h2 class="card__title" id="swap-list-title" data-i18n="sswap.mine"></h2></div>
          <div class="table-wrap" data-list-table>
            <table class="table table--stack">
              <thead><tr><th scope="col" data-i18n="sswap.with"></th><th scope="col" data-i18n="common.reason"></th><th scope="col" data-i18n="common.submitted"></th><th scope="col" data-i18n="common.status"></th><th scope="col"><span class="sr-only" data-i18n="common.actions"></span></th></tr></thead>
              <tbody data-list-body></tbody>
            </table>
          </div>
          <div data-list-empty hidden></div>
          <div class="pagination" data-list-pager></div>
        </section>
            <section class="card" aria-labelledby="incoming-title">
              <div class="card__head"><div><h2 class="card__title" id="incoming-title" data-i18n="sswap.incoming"></h2><p class="card__sub" data-i18n="sswap.incomingSub"></p></div></div>
              <div class="card__body" id="incoming"></div>
            </section>
          </div>
        </div>
      </main>

      <footer class="app-footer" data-i18n="app.footerStudent"></footer>
    </div>
  </div>
</body>
</html>
