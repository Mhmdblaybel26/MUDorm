<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MU Dorm</title>
  <link rel="icon" href="../manager/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <!-- Same design system and shell as the admin console -->
  <link rel="stylesheet" href="../manager/css/base.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/layout.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/components.css?v=20261123h">
  <link rel="stylesheet" href="../manager/css/rtl.css?v=20261123h">
  <link rel="stylesheet" href="css/portal.css?v=20261123h">
  <!-- Not deferred: applies the saved language, direction and theme before the first paint. -->
  <script src="../manager/js/i18n.js?v=20261123h"></script>
  <script src="../manager/js/icons.js?v=20261123h" defer></script>
  <script src="../manager/js/sound.js?v=20261123h" defer></script>
  <script src="../manager/js/config.js?v=20261123h" defer></script>
  <script src="../manager/js/api.js?v=20261123h" defer></script>
  <script src="../manager/js/data.js?v=20261123h" defer></script>
  <script src="../manager/js/translate.js?v=20261123h" defer></script>
  <script src="../manager/js/app.js?v=20261123h" defer></script>
  <script src="../manager/js/charts.js?v=20261123h" defer></script>
  <script src="js/portal.js?v=20261123h" defer></script>
  <script src="js/progress.js?v=20261123h" defer></script>
</head>
<body data-area="student" data-page="progress">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="snav.progress"></h1>
            <p class="page-sub" data-i18n="sprog.sub"></p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn--primary" id="add-study"><span data-icon="clock"></span><span data-i18n="sprog.logStudy"></span></button>
          </div>
        </div>

        <section aria-labelledby="prog-stats-title">
          <h2 class="sr-only" id="prog-stats-title" data-i18n="sprog.statsTitle"></h2>
          <div class="stat-grid" id="prog-stats"></div>
        </section>

        <div class="grid-main-side">
          <section class="card" aria-labelledby="week-title">
            <div class="card__head">
              <div><h2 class="card__title" id="week-title" data-i18n="sprog.weekTitle"></h2><p class="card__sub" data-i18n="sprog.weekSub"></p></div>
              <button type="button" class="btn btn--ghost btn--sm" id="edit-goal"><span data-icon="edit" data-size="16"></span><span data-i18n="sprog.editGoal"></span></button>
            </div>
            <div class="card__body stack">
              <div class="goal" id="goal"></div>
              <div id="week-chart"></div>
            </div>
          </section>
          <section class="card" aria-labelledby="courses-title">
            <div class="card__head">
              <h2 class="card__title" id="courses-title" data-i18n="sprog.courses"></h2>
              <button type="button" class="btn btn--secondary btn--sm" id="add-course"><span data-icon="plus" data-size="16"></span><span data-i18n="sprog.addCourse"></span></button>
            </div>
            <div class="card__body"><ul class="course-list" id="courses"></ul></div>
          </section>
        </div>

        <section class="card" id="study-list" aria-labelledby="study-list-title">
          <div class="card__head"><h2 class="card__title" id="study-list-title" data-i18n="sprog.logTitle"></h2></div>
          <div class="toolbar">
            <div class="toolbar__search">
              <span data-icon="search"></span>
              <label class="sr-only" for="study-search" data-i18n="common.search"></label>
              <input class="control" id="study-search" type="search" autocomplete="off" data-list-search data-i18n-placeholder="sprog.searchPh">
            </div>
            <label class="sr-only" for="study-course" data-i18n="sprog.course"></label>
            <select class="control" id="study-course" data-list-filter="course"></select>
          </div>
          <div class="table-wrap" data-list-table>
            <table class="table table--stack">
              <thead><tr><th scope="col" data-i18n="common.date"></th><th scope="col" data-i18n="sprog.course"></th><th scope="col" data-i18n="sprog.hours"></th><th scope="col" data-i18n="sprog.note"></th><th scope="col"><span class="sr-only" data-i18n="common.actions"></span></th></tr></thead>
              <tbody data-list-body></tbody>
            </table>
          </div>
          <div data-list-empty hidden></div>
          <div class="pagination" data-list-pager></div>
        </section>

        <section class="card" aria-labelledby="achv-title">
          <div class="card__head">
            <h2 class="card__title" id="achv-title" data-i18n="sprog.achievements"></h2>
            <button type="button" class="btn btn--secondary btn--sm" id="add-achv"><span data-icon="plus" data-size="16"></span><span data-i18n="sprog.addAchv"></span></button>
          </div>
          <div class="card__body"><ul class="achv-list" id="achievements"></ul></div>
        </section>

        <section class="card" aria-labelledby="exam-title">
          <div class="card__head">
            <div><h2 class="card__title" id="exam-title" data-i18n="sprog.exams"></h2><p class="card__sub" data-i18n="sprog.examsSub"></p></div>
            <button type="button" class="btn btn--secondary btn--sm" id="add-exam"><span data-icon="plus" data-size="16"></span><span data-i18n="sprog.addExam"></span></button>
          </div>
          <div class="card__body"><ul class="course-list" id="exams"></ul></div>
        </section>
      </main>

      <footer class="app-footer" data-i18n="app.footerStudent"></footer>
    </div>
  </div>

  <dialog class="modal" id="study-modal" aria-labelledby="study-title">
    <form class="modal__form" id="study-modal-form" novalidate>
      <div class="modal__head">
        <div>
          <h2 class="modal__title" id="study-title"></h2>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body">
            <div class="form-grid">
              <div class="field">
                <label class="field__label" for="st-date"><span data-i18n="common.date"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="st-date" name="date" type="date" required >
              </div>
              <div class="field">
                <label class="field__label" for="st-hours"><span data-i18n="sprog.hours"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="st-hours" name="hours" type="number" required aria-describedby="st-hours-hint" min="0.5" max="12" step="0.5" inputmode="decimal">
                <p class="field__hint" id="st-hours-hint" data-i18n="sprog.hoursHint"></p>
              </div>
              <div class="field field--full">
                <label class="field__label" for="st-course"><span data-i18n="sprog.course"></span><span class="field__req" aria-hidden="true">*</span></label>
                <select class="control" id="st-course" name="course" required ></select>
              </div>
              <div class="field field--full">
                <label class="field__label" for="st-note"><span data-i18n="sprog.note"></span></label>
                <input class="control" id="st-note" name="note" type="text" maxlength="120" dir="auto">
              </div>
            </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>
  <dialog class="modal" id="course-modal" aria-labelledby="course-title">
    <form class="modal__form" id="course-modal-form" novalidate>
      <div class="modal__head">
        <div>
          <h2 class="modal__title" id="course-title"></h2>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body">
            <div class="form-grid">
              <div class="field">
                <label class="field__label" for="co-code"><span data-i18n="sprog.code"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="co-code" name="code" type="text" required aria-describedby="co-code-hint" maxlength="9" dir="ltr" autocomplete="off" data-i18n-placeholder="sprog.codePh">
                <p class="field__hint" id="co-code-hint" data-i18n="sprog.codeHint"></p>
              </div>
              <div class="field">
                <label class="field__label" for="co-credits"><span data-i18n="sprog.credits"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="co-credits" name="credits" type="number" required min="1" max="6" step="1" inputmode="numeric">
              </div>
              <div class="field field--full">
                <label class="field__label" for="co-title"><span data-i18n="sprog.courseTitle"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="co-title" name="title" type="text" required maxlength="80" dir="auto">
              </div>
              <div class="field field--full">
                <label class="field__label" for="co-status"><span data-i18n="common.status"></span><span class="field__req" aria-hidden="true">*</span></label>
                <select class="control" id="co-status" name="status" required ></select>
              </div>
            </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>
  <dialog class="modal" id="exam-modal" aria-labelledby="exam-title-m">
    <form class="modal__form" id="exam-modal-form" novalidate>
      <div class="modal__head">
        <div>
          <h2 class="modal__title" id="exam-title-m"></h2>
          <p class="modal__sub" data-i18n="sprog.examReminder"></p>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body">
            <div class="form-grid">
              <div class="field field--full">
                <label class="field__label" for="ex-title"><span data-i18n="sprog.examName"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="ex-title" name="title" type="text" required maxlength="120" dir="auto" data-i18n-placeholder="sprog.examNamePh">
              </div>
              <div class="field">
                <label class="field__label" for="ex-date"><span data-i18n="common.date"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="ex-date" name="exam_date" type="date" required>
              </div>
              <div class="field">
                <label class="field__label" for="ex-time"><span data-i18n="sprog.examTime"></span></label>
                <input class="control" id="ex-time" name="start_time" type="time">
              </div>
              <div class="field">
                <label class="field__label" for="ex-course"><span data-i18n="sprog.course"></span></label>
                <select class="control" id="ex-course" name="course_id"></select>
              </div>
              <div class="field">
                <label class="field__label" for="ex-location"><span data-i18n="sprog.examPlace"></span></label>
                <input class="control" id="ex-location" name="location" type="text" maxlength="120" dir="auto">
              </div>
            </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>
  <dialog class="modal" id="achv-modal" aria-labelledby="achv-title-m">
    <form class="modal__form" id="achv-modal-form" novalidate>
      <div class="modal__head">
        <div>
          <h2 class="modal__title" id="achv-title-m"></h2>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body">
            <div class="form-grid">
              <div class="field field--full">
                <label class="field__label" for="ac-title"><span data-i18n="sprog.achvTitle"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="ac-title" name="title" type="text" required maxlength="100" dir="auto">
              </div>
              <div class="field">
                <label class="field__label" for="ac-category"><span data-i18n="sprog.category"></span><span class="field__req" aria-hidden="true">*</span></label>
                <select class="control" id="ac-category" name="category" required ></select>
              </div>
              <div class="field">
                <label class="field__label" for="ac-date"><span data-i18n="common.date"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="ac-date" name="date" type="date" required >
              </div>
            </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>
  <dialog class="modal modal--sm" id="goal-modal" aria-labelledby="goal-title">
    <form class="modal__form" id="goal-modal-form" novalidate>
      <div class="modal__head">
        <div>
          <h2 class="modal__title" id="goal-title"></h2>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body">
              <div class="field">
                <label class="field__label" for="goal-hours"><span data-i18n="sprog.goalLabel"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="goal-hours" name="goal" type="number" required aria-describedby="goal-hours-hint" min="1" max="60" step="1" inputmode="numeric">
                <p class="field__hint" id="goal-hours-hint" data-i18n="sprog.goalHint"></p>
              </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
