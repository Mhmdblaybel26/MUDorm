<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DMS</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=20261123h">
  <link rel="stylesheet" href="css/layout.css?v=20261123h">
  <link rel="stylesheet" href="css/components.css?v=20261123h">
  <link rel="stylesheet" href="css/rtl.css?v=20261123h">
  <script src="js/i18n.js?v=20261123h"></script>
  <script src="js/icons.js?v=20261123h" defer></script>
  <script src="js/sound.js?v=20261123h" defer></script>
  <script src="js/config.js?v=20261123h" defer></script>
  <script src="js/api.js?v=20261123h" defer></script>
  <script src="js/data.js?v=20261123h" defer></script>
  <script src="js/translate.js?v=20261123h" defer></script>
  <script src="js/app.js?v=20261123h" defer></script>
  <script src="js/rules.js?v=20261123h" defer></script>
</head>
<body data-page="rules">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="nav.rules"></h1>
            <p class="page-sub" data-i18n="rules.sub"></p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn--primary" id="add-rule"><span data-icon="plus"></span><span data-i18n="rules.add"></span></button>
          </div>
        </div>
        <section class="card" id="rule-list" aria-labelledby="rule-list-title">
          <h2 class="sr-only" id="rule-list-title" data-i18n="rules.listTitle"></h2>
          <div class="toolbar">
            <div class="toolbar__search">
              <span data-icon="search"></span>
              <label class="sr-only" for="rule-search" data-i18n="common.search"></label>
              <input class="control" id="rule-search" type="search" autocomplete="off" data-list-search data-i18n-placeholder="rules.searchPh">
            </div>
          </div>
          <div data-list-table><ol class="rule-list" data-list-body></ol></div>
          <div data-list-empty hidden></div>
          <div class="pagination" data-list-pager></div>
        </section>
      </main>

      <footer class="app-footer" data-i18n="app.footer"></footer>
    </div>
  </div>

  <dialog class="modal" id="rule-modal" aria-labelledby="rule-modal-title">
    <form class="modal__form" id="rule-form" novalidate>
      <div class="modal__head">
        <div>
          <h2 class="modal__title" id="rule-modal-title"></h2>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body stack">
          <div class="form-grid">
            <div class="field field--full">
              <label class="field__label" for="rule-title"><span data-i18n="rules.fTitle"></span><span class="field__req" aria-hidden="true">*</span></label>
              <input class="control" id="rule-title" name="title" type="text" required maxlength="80" dir="auto">
            </div>
            <div class="field field--full">
              <label class="field__label" for="rule-body"><span data-i18n="rules.fBody"></span><span class="field__req" aria-hidden="true">*</span></label>
              <textarea class="control" id="rule-body" name="body" required aria-describedby="rule-body-hint" maxlength="600" dir="auto" rows="6"></textarea>
              <p class="field__hint" id="rule-body-hint" data-i18n="common.oneLanguage"></p>
            </div>
          </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
