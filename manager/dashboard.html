<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DMS</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=20261123h">
  <link rel="stylesheet" href="css/layout.css?v=20261123h">
  <link rel="stylesheet" href="css/components.css?v=20261123h">
  <link rel="stylesheet" href="css/rtl.css?v=20261123h">
  <script src="js/i18n.js?v=20261123h"></script>
  <script src="js/icons.js?v=20261123h" defer></script>
  <script src="js/sound.js?v=20261123h" defer></script>
  <script src="js/config.js?v=20261123h" defer></script>
  <script src="js/api.js?v=20261123h" defer></script>
  <script src="js/data.js?v=20261123h" defer></script>
  <script src="js/translate.js?v=20261123h" defer></script>
  <script src="js/app.js?v=20261123h" defer></script>
  <script src="js/charts.js?v=20261123h" defer></script>
  <script src="js/dashboard.js?v=20261123h" defer></script>
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="nav.dashboard"></h1>
            <p class="page-sub" data-i18n="dash.sub"></p>
          </div>
          <div class="page-actions">
            <a class="btn btn--secondary" href="applications.html"><span data-icon="clipboard"></span><span data-i18n="dash.reviewApps"></span></a>
            <a class="btn btn--primary" href="allocation.html"><span data-icon="key"></span><span data-i18n="dash.allocate"></span></a>
          </div>
        </div>

        <section aria-labelledby="kpi-title">
          <h2 class="sr-only" id="kpi-title" data-i18n="dash.kpis"></h2>
          <div class="stat-grid stat-grid--5" id="kpis"></div>
        </section>

        <div class="grid-2">
          <section class="card" aria-labelledby="occ-title">
            <div class="card__head">
              <div><h2 class="card__title" id="occ-title" data-i18n="dash.occTitle"></h2><p class="card__sub" data-i18n="dash.occSub"></p></div>
            </div>
            <div class="card__body" id="occ-chart"></div>
          </section>
          <section class="card" aria-labelledby="cmp-title">
            <div class="card__head">
              <div><h2 class="card__title" id="cmp-title" data-i18n="dash.cmpTitle"></h2><p class="card__sub" data-i18n="dash.cmpSub"></p></div>
              <a class="btn btn--ghost btn--sm" href="complaints.html"><span data-i18n="common.viewAll"></span><span data-icon="arrow-right" data-size="16"></span></a>
            </div>
            <div class="card__body" id="cmp-chart"></div>
          </section>
        </div>

        <div class="grid-main-side">
          <section class="card" aria-labelledby="act-title">
            <div class="card__head"><h2 class="card__title" id="act-title" data-i18n="dash.activity"></h2></div>
            <div class="card__body" id="activity"></div>
          </section>
          <section class="card" aria-labelledby="attention-title">
            <div class="card__head"><h2 class="card__title" id="attention-title" data-i18n="dash.attention"></h2></div>
            <div class="card__body" id="attention"></div>
          </section>
        </div>
      </main>

      <footer class="app-footer" data-i18n="app.footer"></footer>
    </div>
  </div>
</body>
</html>
