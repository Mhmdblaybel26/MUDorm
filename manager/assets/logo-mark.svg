<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MU Student Housing">
  <!-- Small version of logo.svg for sizes under about 56px (sidebar, dorm pass,
       printed card): the house, "MU" and the swoosh, without the Arabic name. -->
  <defs>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2603a"/>
      <stop offset="1" stop-color="#b8391f"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4fa8"/>
      <stop offset="1" stop-color="#0f2f6e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f5a300"/>
    </linearGradient>
  </defs>

  <rect x="350" y="80" width="58" height="130" rx="10" fill="url(#brick)"/>
  <g fill="none" stroke="url(#brick)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 226V460H414V226" fill="#ffffff"/>
    <path d="M46 238 256 50l210 188" fill="#ffffff"/>
  </g>
  <path d="M117 242h278v199H117z" fill="#ffffff"/>

  <g fill="none" stroke="url(#navy)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 250v-72l38 50 38-50v72"/>
    <path d="M280 178v40a32 32 0 0 0 64 0v-40"/>
  </g>

  <path d="M132 276c58 12 98 52 118 104 30-52 78-92 142-112-50 44-92 94-126 150-28-62-70-108-134-142z" fill="url(#gold)" transform="translate(-6 34)"/>
  <path d="M128 258c62 6 108 40 134 92 30-46 74-80 136-98-48 38-92 86-128 142-30-60-76-104-142-136z" fill="url(#navy)" transform="translate(0 22)"/>
</svg>
