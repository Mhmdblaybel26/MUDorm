<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DMS</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=20261123h">
  <link rel="stylesheet" href="css/layout.css?v=20261123h">
  <link rel="stylesheet" href="css/components.css?v=20261123h">
  <link rel="stylesheet" href="css/rtl.css?v=20261123h">
  <script src="js/i18n.js?v=20261123h"></script>
  <script src="js/icons.js?v=20261123h" defer></script>
  <script src="js/sound.js?v=20261123h" defer></script>
  <script src="js/config.js?v=20261123h" defer></script>
  <script src="js/api.js?v=20261123h" defer></script>
  <script src="js/data.js?v=20261123h" defer></script>
  <script src="js/translate.js?v=20261123h" defer></script>
  <script src="js/app.js?v=20261123h" defer></script>
  <script src="js/settings.js?v=20261123h" defer></script>
</head>
<body data-page="settings">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="nav.settings"></h1>
            <p class="page-sub" data-i18n="settings.sub"></p>
          </div>
        </div>

        <div class="settings-grid">
          <div class="settings-col">
          <section class="card" aria-labelledby="profile-title">
            <div class="card__head">
              <div>
                <h2 class="card__title" id="profile-title" data-i18n="settings.profileTitle"></h2>
                <p class="card__sub" data-i18n="settings.profileSub"></p>
              </div>
            </div>
            <form class="card__body stack" id="profile-form" novalidate>
              <div class="field">
                <span class="field__label" id="avatar-label" data-i18n="settings.photo"></span>
                <div class="upload">
                  <div class="upload__preview upload__preview--round" id="avatar-preview"></div>
                  <div class="upload__actions">
                    <input class="upload__input" id="avatar-input" name="avatar" type="file" accept="image/jpeg,image/png,image/webp,image/gif" aria-describedby="avatar-label avatar-hint">
                    <label class="btn btn--secondary btn--sm" for="avatar-input"><span data-icon="upload" data-size="16"></span><span data-i18n="settings.choosePhoto"></span></label>
                    <button type="button" class="btn btn--ghost btn--sm" id="avatar-remove" data-i18n="settings.removePhoto" hidden></button>
                    <p class="field__hint" id="avatar-hint" data-i18n="rooms.photoHint"></p>
                  </div>
                </div>
              </div>
              <div class="form-grid">
                <div class="field">
                  <label class="field__label" for="name-en"><span data-i18n="settings.nameEn"></span><span class="field__req" aria-hidden="true">*</span></label>
                  <input class="control" id="name-en" name="name" type="text" maxlength="60" autocomplete="name" lang="en" dir="ltr" required>
                </div>
                <div class="field">
                  <label class="field__label" for="name-ar"><span data-i18n="settings.nameAr"></span></label>
                  <input class="control" id="name-ar" name="name_ar" type="text" maxlength="60" lang="ar" dir="rtl">
                </div>
              </div>
              <div class="field">
                <label class="field__label" for="admin-username"><span data-i18n="setup.username"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="admin-username" name="username" type="text" maxlength="30" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" required aria-describedby="admin-username-hint">
                <p class="field__hint" id="admin-username-hint" data-i18n="settings.usernameHint"></p>
              </div>
              <div class="field">
                <label class="field__label" for="admin-email" data-i18n="settings.email"></label>
                <input class="control" id="admin-email" name="email" type="email" maxlength="120" dir="ltr" autocomplete="email" spellcheck="false" placeholder="name@gmail.com" aria-describedby="admin-email-hint">
                <p class="field__hint" id="admin-email-hint" data-i18n="settings.emailHint"></p>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn--primary" data-i18n="settings.saveProfile"></button>
              </div>
            </form>
          </section>
          <section class="card" aria-labelledby="prefs-title">
            <div class="card__head">
              <div>
                <h2 class="card__title" id="prefs-title" data-i18n="settings.prefsTitle"></h2>
                <p class="card__sub" data-i18n="settings.prefsSub"></p>
              </div>
            </div>
            <div class="card__body stack">
              <div class="field">
                <label class="field__label" for="pref-lang" data-i18n="settings.language"></label>
                <select class="control" id="pref-lang">
                  <option value="en" lang="en">English</option>
                  <option value="ar" lang="ar">العربية</option>
                </select>
              </div>
              <div class="field">
                <label class="field__label" for="pref-theme" data-i18n="settings.theme"></label>
                <select class="control" id="pref-theme">
                  <option value="system" data-i18n="settings.themeSystem"></option>
                  <option value="light" data-i18n="settings.themeLight"></option>
                  <option value="dark" data-i18n="settings.themeDark"></option>
                </select>
              </div>
              <div class="field">
                <label class="field__label" for="pref-sound" data-i18n="settings.sound"></label>
                <select class="control" id="pref-sound">
                  <option value="on" data-i18n="settings.on"></option>
                  <option value="off" data-i18n="settings.off"></option>
                </select>
              </div>
              <div class="field">
                <span class="field__label" data-i18n="settings.desktop"></span>
                <p class="field__hint" id="desktop-status"></p>
                <div><button type="button" class="btn btn--secondary btn--sm" id="desktop-toggle"></button></div>
              </div>
            </div>
          </section>
          </div>
          <div class="settings-col">
          <section class="card" aria-labelledby="password-title">
            <div class="card__head">
              <div>
                <h2 class="card__title" id="password-title" data-i18n="settings.passwordTitle"></h2>
                <p class="card__sub" data-i18n="settings.passwordSub"></p>
              </div>
            </div>
            <form class="card__body stack" id="password-form" novalidate>
              <input type="email" name="username" autocomplete="username" hidden>
              <div class="field">
                <label class="field__label" for="pw-current"><span data-i18n="settings.currentPassword"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="pw-current" name="current" type="password" autocomplete="current-password" required>
              </div>
              <div class="field">
                <label class="field__label" for="pw-new"><span data-i18n="settings.newPassword"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="pw-new" name="password" type="password" autocomplete="new-password" required aria-describedby="pw-rules">
                <ul class="rules" id="pw-rules" aria-live="polite"></ul>
              </div>
              <div class="field">
                <label class="field__label" for="pw-confirm"><span data-i18n="settings.confirmPassword"></span><span class="field__req" aria-hidden="true">*</span></label>
                <input class="control" id="pw-confirm" name="confirm" type="password" autocomplete="new-password" required>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn--primary" data-i18n="settings.savePassword"></button>
              </div>
            </form>
          </section>
          <section class="card" aria-labelledby="tech-title">
            <div class="card__head">
              <div>
                <h2 class="card__title" id="tech-title" data-i18n="tech.title"></h2>
                <p class="card__sub" data-i18n="tech.sub"></p>
              </div>
            </div>
            <div class="card__body stack">
              <ul class="activity" id="tech-list"></ul>
              <form class="stack" id="tech-form" novalidate>
                <div class="form-grid">
                  <div class="field">
                    <label class="field__label" for="tech-name"><span data-i18n="tech.name"></span><span class="field__req" aria-hidden="true">*</span></label>
                    <input class="control" id="tech-name" name="name" type="text" maxlength="80" required dir="auto">
                  </div>
                  <div class="field">
                    <label class="field__label" for="tech-specialty"><span data-i18n="tech.specialty"></span><span class="field__req" aria-hidden="true">*</span></label>
                    <select class="control" id="tech-specialty" name="specialty" required></select>
                  </div>
                  <div class="field field--full">
                    <label class="field__label" for="tech-phone" data-i18n="tech.phone"></label>
                    <input class="control" id="tech-phone" name="phone" type="tel" maxlength="20" dir="ltr">
                  </div>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn btn--secondary"><span data-icon="plus" data-size="16"></span><span data-i18n="tech.add"></span></button>
                </div>
              </form>
            </div>
          </section>
          <section class="card" aria-labelledby="mail-log-title">
            <div class="card__head">
              <div>
                <h2 class="card__title" id="mail-log-title" data-i18n="maillog.title"></h2>
                <p class="card__sub" data-i18n="maillog.sub"></p>
              </div>
            </div>
            <div class="card__body stack">
              <div id="mail-status"></div>
              <form class="stack" id="mail-test-form" novalidate>
                <div class="field">
                  <label class="field__label" for="mail-test-to" data-i18n="maillog.testLabel"></label>
                  <input class="control" id="mail-test-to" name="to" type="email" maxlength="120" dir="ltr" autocomplete="email" spellcheck="false" placeholder="name@gmail.com" aria-describedby="mail-test-hint">
                  <p class="field__hint" id="mail-test-hint" data-i18n="maillog.testHint"></p>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn btn--secondary"><span data-icon="mail" data-size="16"></span><span data-i18n="maillog.testSend"></span></button>
                </div>
              </form>
              <ul class="activity" id="mail-log"></ul>
            </div>
          </section>
          </div>
        </div>
      </main>

      <footer class="app-footer" data-i18n="app.footer"></footer>
    </div>
  </div>
</body>
</html>
