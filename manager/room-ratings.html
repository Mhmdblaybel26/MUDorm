<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DMS</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=20261123h">
  <link rel="stylesheet" href="css/layout.css?v=20261123h">
  <link rel="stylesheet" href="css/components.css?v=20261123h">
  <link rel="stylesheet" href="css/rtl.css?v=20261123h">
  <script src="js/i18n.js?v=20261123h"></script>
  <script src="js/icons.js?v=20261123h" defer></script>
  <script src="js/sound.js?v=20261123h" defer></script>
  <script src="js/config.js?v=20261123h" defer></script>
  <script src="js/api.js?v=20261123h" defer></script>
  <script src="js/data.js?v=20261123h" defer></script>
  <script src="js/translate.js?v=20261123h" defer></script>
  <script src="js/app.js?v=20261123h" defer></script>
  <script src="js/room-ratings.js?v=20261123h" defer></script>
</head>
<body data-page="ratings">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="nav.ratings"></h1>
            <p class="page-sub" data-i18n="ratings.sub"></p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn--primary" id="add-rating"><span data-icon="plus"></span><span data-i18n="ratings.add"></span></button>
          </div>
        </div>

        <section class="card" id="avg-list" aria-labelledby="avg-title">
          <div class="card__head">
            <div>
              <h2 class="card__title" id="avg-title" data-i18n="ratings.avgTitle"></h2>
              <p class="card__sub" data-i18n="ratings.avgSub"></p>
            </div>
          </div>
          <div class="table-wrap" data-list-table>
            <table class="table table--stack">
              <thead>
                <tr>
                  <th scope="col" data-i18n="common.room"></th>
                  <th scope="col" data-i18n="ratings.cleanliness"></th>
                  <th scope="col" data-i18n="ratings.discipline"></th>
                  <th scope="col" data-i18n="ratings.count"></th>
                  <th scope="col" data-i18n="ratings.latest"></th>
                  <th scope="col"><span class="sr-only" data-i18n="common.actions"></span></th>
                </tr>
              </thead>
              <tbody data-list-body></tbody>
            </table>
          </div>
          <div data-list-empty hidden></div>
          <div class="pagination" data-list-pager></div>
        </section>

        <section class="card" id="rating-list" aria-labelledby="history-title">
          <div class="card__head">
            <h2 class="card__title" id="history-title" data-i18n="ratings.historyTitle"></h2>
          </div>
          <div class="toolbar">
            <div class="toolbar__search">
              <span data-icon="search"></span>
              <label class="sr-only" for="rating-search" data-i18n="common.search"></label>
              <input class="control" id="rating-search" type="search" autocomplete="off" data-list-search data-i18n-placeholder="ratings.searchPh">
            </div>
            <label class="sr-only" for="rating-room" data-i18n="common.room"></label>
            <select class="control" id="rating-room" data-list-filter="room"></select>
            <label class="sr-only" for="rating-period" data-i18n="ratings.period"></label>
            <select class="control" id="rating-period" data-list-filter="period"></select>
          </div>
          <div class="table-wrap" data-list-table>
            <table class="table table--stack">
              <thead>
                <tr>
                  <th scope="col" data-i18n="ratings.period"></th>
                  <th scope="col" data-i18n="common.room"></th>
                  <th scope="col" data-i18n="ratings.cleanliness"></th>
                  <th scope="col" data-i18n="ratings.discipline"></th>
                  <th scope="col" data-i18n="ratings.comment"></th>
                  <th scope="col"><span class="sr-only" data-i18n="common.actions"></span></th>
                </tr>
              </thead>
              <tbody data-list-body></tbody>
            </table>
          </div>
          <div data-list-empty hidden></div>
          <div class="pagination" data-list-pager></div>
        </section>
      </main>

      <footer class="app-footer" data-i18n="app.footer"></footer>
    </div>
  </div>

  <dialog class="modal" id="rating-modal" aria-labelledby="rating-modal-title">
    <form class="modal__form" id="rating-form" novalidate>
      <div class="modal__head">
        <h2 class="modal__title" id="rating-modal-title"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body">
        <div class="form-grid">
          <div class="field">
            <label class="field__label" for="rating-room-input"><span data-i18n="common.room"></span><span class="field__req" aria-hidden="true">*</span></label>
            <select class="control" id="rating-room-input" name="room_id" required></select>
          </div>
          <div class="field">
            <label class="field__label" for="rating-period-input"><span data-i18n="ratings.period"></span><span class="field__req" aria-hidden="true">*</span></label>
            <input class="control" id="rating-period-input" name="period" type="month" required>
          </div>
          <div class="field">
            <label class="field__label" for="rating-clean"><span data-i18n="ratings.cleanliness"></span><span class="field__req" aria-hidden="true">*</span></label>
            <input class="control" id="rating-clean" name="cleanliness" type="number" min="1" max="10" step="1" inputmode="numeric" required aria-describedby="rating-scale">
          </div>
          <div class="field">
            <label class="field__label" for="rating-disc"><span data-i18n="ratings.discipline"></span><span class="field__req" aria-hidden="true">*</span></label>
            <input class="control" id="rating-disc" name="discipline" type="number" min="1" max="10" step="1" inputmode="numeric" required aria-describedby="rating-scale">
          </div>
          <p class="field__hint field--full" id="rating-scale" data-i18n="ratings.scaleHint"></p>
          <div class="field field--full">
            <label class="field__label" for="rating-comment" data-i18n="ratings.comment"></label>
            <textarea class="control" id="rating-comment" name="comment" maxlength="300" dir="auto"></textarea>
          </div>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
