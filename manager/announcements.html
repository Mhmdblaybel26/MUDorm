<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DMS</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=20261123h">
  <link rel="stylesheet" href="css/layout.css?v=20261123h">
  <link rel="stylesheet" href="css/components.css?v=20261123h">
  <link rel="stylesheet" href="css/rtl.css?v=20261123h">
  <script src="js/i18n.js?v=20261123h"></script>
  <script src="js/icons.js?v=20261123h" defer></script>
  <script src="js/sound.js?v=20261123h" defer></script>
  <script src="js/config.js?v=20261123h" defer></script>
  <script src="js/api.js?v=20261123h" defer></script>
  <script src="js/data.js?v=20261123h" defer></script>
  <script src="js/translate.js?v=20261123h" defer></script>
  <script src="js/app.js?v=20261123h" defer></script>
  <script src="js/announcements.js?v=20261123h" defer></script>
</head>
<body data-page="announcements">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="nav.announcements"></h1>
            <p class="page-sub" data-i18n="ann.sub"></p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn--primary" id="add-ann"><span data-icon="plus"></span><span data-i18n="ann.add"></span></button>
          </div>
        </div>

        <section class="card" id="ann-list" aria-labelledby="ann-list-title">
          <h2 class="sr-only" id="ann-list-title" data-i18n="ann.listTitle"></h2>
          <div class="toolbar">
            <div class="toolbar__search">
              <span data-icon="search"></span>
              <label class="sr-only" for="ann-search" data-i18n="common.search"></label>
              <input class="control" id="ann-search" type="search" autocomplete="off" data-list-search data-i18n-placeholder="ann.searchPh">
            </div>
            <label class="sr-only" for="ann-filter" data-i18n="ann.show"></label>
            <select class="control" id="ann-filter" data-list-filter="pinned">
              <option value="all" data-i18n="ann.allAnn"></option>
              <option value="pinned" data-i18n="ann.pinnedOnly"></option>
              <option value="unpinned" data-i18n="ann.unpinnedOnly"></option>
            </select>
          </div>
          <div data-list-table>
            <ul class="ann-list" data-list-body></ul>
          </div>
          <div data-list-empty hidden></div>
          <div class="pagination" data-list-pager></div>
        </section>
      </main>

      <footer class="app-footer" data-i18n="app.footer"></footer>
    </div>
  </div>

  <dialog class="modal modal--lg" id="ann-modal" aria-labelledby="ann-modal-title">
    <form class="modal__form" id="ann-form" novalidate>
      <div class="modal__head">
        <h2 class="modal__title" id="ann-modal-title"></h2>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close"><span data-icon="x"></span></button>
      </div>
      <div class="modal__body">
        <div class="form-grid">
          <div class="field field--full">
            <label class="field__label" for="ann-title"><span data-i18n="ann.fTitle"></span><span class="field__req" aria-hidden="true">*</span></label>
            <input class="control" id="ann-title" name="title" type="text" maxlength="120" dir="auto" required>
          </div>
          <div class="field field--full">
            <label class="field__label" for="ann-body"><span data-i18n="ann.fBody"></span><span class="field__req" aria-hidden="true">*</span></label>
            <textarea class="control" id="ann-body" name="body" maxlength="1500" dir="auto" rows="7" required aria-describedby="ann-lang-hint"></textarea>
            <p class="field__hint" id="ann-lang-hint" data-i18n="common.oneLanguage"></p>
          </div>
          <div class="field">
            <label class="field__label" for="ann-date"><span data-i18n="common.date"></span><span class="field__req" aria-hidden="true">*</span></label>
            <input class="control" id="ann-date" name="date" type="date" required>
          </div>
          <div class="field">
            <span class="field__label" data-i18n="ann.visibility"></span>
            <label class="check"><input type="checkbox" name="pinned"><span class="check__text"><span data-i18n="ann.fPinned"></span><small data-i18n="ann.pinnedHint"></small></span></label>
          </div>
        </div>
      </div>
      <div class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
        <button type="submit" class="btn btn--primary" data-i18n="ann.publish"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
