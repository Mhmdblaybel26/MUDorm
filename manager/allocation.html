<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DMS</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=20261123h">
  <link rel="stylesheet" href="css/layout.css?v=20261123h">
  <link rel="stylesheet" href="css/components.css?v=20261123h">
  <link rel="stylesheet" href="css/rtl.css?v=20261123h">
  <script src="js/i18n.js?v=20261123h"></script>
  <script src="js/icons.js?v=20261123h" defer></script>
  <script src="js/sound.js?v=20261123h" defer></script>
  <script src="js/config.js?v=20261123h" defer></script>
  <script src="js/api.js?v=20261123h" defer></script>
  <script src="js/data.js?v=20261123h" defer></script>
  <script src="js/translate.js?v=20261123h" defer></script>
  <script src="js/app.js?v=20261123h" defer></script>
  <script src="js/allocation.js?v=20261123h" defer></script>
</head>
<body data-page="allocation">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="nav.allocation"></h1>
            <p class="page-sub" data-i18n="alloc.sub"></p>
          </div>
        </div>

        <div class="grid-aside">
          <section class="card" aria-labelledby="alloc-form-title">
            <div class="card__head">
              <div>
                <h2 class="card__title" id="alloc-form-title" data-i18n="alloc.formTitle"></h2>
                <p class="card__sub" data-i18n="alloc.formSub"></p>
              </div>
            </div>
            <form class="card__body stack" id="alloc-form" novalidate>
              <div id="waiting"></div>
              <div class="notice notice--danger" id="alloc-error" role="alert" hidden></div>
              <div class="field">
                <label class="field__label" for="alloc-student"><span data-i18n="common.student"></span><span class="field__req" aria-hidden="true">*</span></label>
                <select class="control" id="alloc-student" name="student_id" required></select>
              </div>
              <div class="field">
                <label class="field__label" for="alloc-room"><span data-i18n="common.room"></span><span class="field__req" aria-hidden="true">*</span></label>
                <select class="control" id="alloc-room" name="room_id" required aria-describedby="alloc-room-info"></select>
                <p class="field__hint" id="alloc-room-info" aria-live="polite"></p>
              </div>
              <div class="form-grid">
                <div class="field">
                  <label class="field__label" for="alloc-year"><span data-i18n="term.year"></span><span class="field__req" aria-hidden="true">*</span></label>
                  <select class="control" id="alloc-year" name="academic_year" required></select>
                </div>
                <div class="field">
                  <label class="field__label" for="alloc-semester"><span data-i18n="term.semester"></span><span class="field__req" aria-hidden="true">*</span></label>
                  <select class="control" id="alloc-semester" name="semester" required aria-describedby="alloc-term-hint"></select>
                </div>
                <p class="field__hint field--full" id="alloc-term-hint" data-i18n="alloc.termHint"></p>
                <div class="field">
                  <label class="field__label" for="alloc-start"><span data-i18n="alloc.start"></span><span class="field__req" aria-hidden="true">*</span></label>
                  <input class="control" id="alloc-start" name="start_date" type="date" required>
                </div>
                <div class="field">
                  <label class="field__label" for="alloc-end"><span data-i18n="alloc.end"></span><span class="field__req" aria-hidden="true">*</span></label>
                  <input class="control" id="alloc-end" name="end_date" type="date" required>
                </div>
              </div>
              <p class="field__hint" id="alloc-current" aria-live="polite"></p>
              <div class="form-actions">
                <button type="button" class="btn btn--ghost" id="alloc-reset" data-i18n="alloc.clear"></button>
                <button type="submit" class="btn btn--primary"><span data-icon="key" data-size="16"></span><span data-i18n="alloc.submit"></span></button>
              </div>
            </form>
          </section>

          <section class="card" id="alloc-list" aria-labelledby="alloc-list-title">
            <div class="card__head">
              <h2 class="card__title" id="alloc-list-title" data-i18n="alloc.listTitle"></h2>
            </div>
            <div class="toolbar">
              <div class="toolbar__search">
                <span data-icon="search"></span>
                <label class="sr-only" for="alloc-search" data-i18n="common.search"></label>
                <input class="control" id="alloc-search" type="search" autocomplete="off" data-list-search data-i18n-placeholder="alloc.searchPh">
              </div>
              <label class="sr-only" for="alloc-wing" data-i18n="common.wing"></label>
              <select class="control" id="alloc-wing" data-list-filter="wing">
                <option value="all" data-i18n="common.allWings"></option>
                <option value="A" data-i18n="wing.A"></option>
                <option value="B" data-i18n="wing.B"></option>
                <option value="C" data-i18n="wing.C"></option>
                <option value="D" data-i18n="wing.D"></option>
              </select>
              <label class="sr-only" for="alloc-status" data-i18n="common.status"></label>
              <select class="control" id="alloc-status" data-list-filter="status">
                <option value="active" data-i18n="status.active"></option>
                <option value="ended" data-i18n="status.ended"></option>
                <option value="all" data-i18n="common.allStatuses"></option>
              </select>
              <div class="toolbar__term" data-term-fields="alloc-term"></div>
            </div>
            <div class="table-wrap" data-list-table>
              <table class="table table--stack">
                <thead>
                  <tr>
                    <th scope="col" data-i18n="common.student"></th>
                    <th scope="col" data-i18n="common.room"></th>
                    <th scope="col" data-i18n="alloc.period"></th>
                    <th scope="col" data-i18n="common.status"></th>
                    <th scope="col"><span class="sr-only" data-i18n="common.actions"></span></th>
                  </tr>
                </thead>
                <tbody data-list-body></tbody>
              </table>
            </div>
            <div data-list-empty hidden></div>
            <div class="pagination" data-list-pager></div>
          </section>
        </div>
      </main>

      <footer class="app-footer" data-i18n="app.footer"></footer>
    </div>
  </div>
</body>
</html>
