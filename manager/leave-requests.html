<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DMS</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css?v=20261123h">
  <link rel="stylesheet" href="css/layout.css?v=20261123h">
  <link rel="stylesheet" href="css/components.css?v=20261123h">
  <link rel="stylesheet" href="css/rtl.css?v=20261123h">
  <script src="js/i18n.js?v=20261123h"></script>
  <script src="js/icons.js?v=20261123h" defer></script>
  <script src="js/sound.js?v=20261123h" defer></script>
  <script src="js/config.js?v=20261123h" defer></script>
  <script src="js/api.js?v=20261123h" defer></script>
  <script src="js/data.js?v=20261123h" defer></script>
  <script src="js/translate.js?v=20261123h" defer></script>
  <script src="js/app.js?v=20261123h" defer></script>
  <script src="js/leave-requests.js?v=20261123h" defer></script>
</head>
<body data-page="leaves">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="app__body">
      <header class="topbar" id="topbar"></header>

      <main class="main" id="main" tabindex="-1">
        <div class="page-head">
          <div class="page-head__text">
            <h1 class="page-title" data-i18n="nav.leaves"></h1>
            <p class="page-sub" data-i18n="leaves.sub"></p>
          </div>
        </div>

        <div class="chips" id="status-chips" role="group" data-i18n-aria-label="common.quickFilter"></div>

        <section class="card" id="leave-list" aria-labelledby="leave-list-title">
          <h2 class="sr-only" id="leave-list-title" data-i18n="leaves.listTitle"></h2>
          <div class="toolbar">
            <div class="toolbar__search">
              <span data-icon="search"></span>
              <label class="sr-only" for="leave-search" data-i18n="common.search"></label>
              <input class="control" id="leave-search" type="search" autocomplete="off" data-list-search data-i18n-placeholder="leaves.searchPh">
            </div>
            <label class="sr-only" for="leave-status" data-i18n="common.status"></label>
            <select class="control" id="leave-status" data-list-filter="status">
              <option value="all" data-i18n="common.allStatuses"></option>
              <option value="pending" data-i18n="status.pending"></option>
              <option value="approved" data-i18n="status.approved"></option>
              <option value="rejected" data-i18n="status.rejected"></option>
            </select>
            <label class="sr-only" for="leave-when" data-i18n="leaves.when"></label>
            <select class="control" id="leave-when" data-list-filter="when">
              <option value="all" data-i18n="leaves.anyTime"></option>
              <option value="upcoming" data-i18n="leaves.upcoming"></option>
              <option value="past" data-i18n="leaves.past"></option>
            </select>
          </div>
          <div class="table-wrap" data-list-table>
            <table class="table table--stack">
              <thead>
                <tr>
                  <th scope="col" data-i18n="common.student"></th>
                  <th scope="col" data-i18n="leaves.dates"></th>
                  <th scope="col" data-i18n="leaves.destination"></th>
                  <th scope="col" data-i18n="common.reason"></th>
                  <th scope="col" data-i18n="common.status"></th>
                  <th scope="col"><span class="sr-only" data-i18n="common.actions"></span></th>
                </tr>
              </thead>
              <tbody data-list-body></tbody>
            </table>
          </div>
          <div data-list-empty hidden></div>
          <div class="pagination" data-list-pager></div>
        </section>
      </main>

      <footer class="app-footer" data-i18n="app.footer"></footer>
    </div>
  </div>

  <dialog class="modal" id="leave-modal" aria-labelledby="leave-modal-title">
    <form class="modal__form" id="leave-form" novalidate>
      <div class="modal__head">
        <div>
          <h2 class="modal__title" id="leave-modal-title"></h2>
          <p class="modal__sub" id="leave-modal-sub"></p>
        </div>
        <button type="button" class="icon-btn" data-close data-i18n-aria-label="common.close" autofocus><span data-icon="x"></span></button>
      </div>
      <div class="modal__body">
        <dl class="details" id="leave-details"></dl>
        <div id="leave-decision"></div>
      </div>
      <div class="modal__foot modal__foot--split" id="leave-foot"></div>
    </form>
  </dialog>
</body>
</html>
