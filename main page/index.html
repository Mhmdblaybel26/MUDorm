  <dialog class="modal modal--lg apply-dialog" id="apply-modal" aria-labelledby="apply-modal-title">

      <div>
        <h2 class="modal__title" id="apply-modal-title" data-i18n="apply.formTitle"></h2>

      <form
                class="apply__form"
                id="apply-form"
                novalidate
                aria-labelledby="apply-modal-title"
              >
                <!-- The fields are drawn by main.js from the form the dorm office set up (admin "Application form"). -->
                <div class="apply__fields" id="apply-fields"></div>
                <div
                  class="notice notice--danger"
                  id="apply-error"
                  role="alert"
                  tabindex="-1"
                  hidden
                ></div>
                <div>
                  <button type="submit" class="btn btn--primary btn--lg">
                    <span data-icon="check" data-size="18"></span
                    ><span data-i18n="apply.submit"></span>
                  </button>
                </div>
              </form>

                class="apply__success"
                id="apply-success"
                tabindex="-1"
                hidden
              >

                  ><span data-icon="check-circle" data-size="28"></span
                ></span>

                <button type="button" class="btn btn--primary" id="apply-done" data-i18n="apply.done"></button>
                <button
                  type="button"
                  class="btn btn--secondary"
                  id="apply-again"
                  data-i18n="apply.another"
                ></button>
              </div>
    </div>
